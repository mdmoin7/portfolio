name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minifier
        run: pip install htmlmin

      - name: Build static site
        run: |
          python3 - << 'PYEOF'
          import htmlmin
          import os
          import re
          import shutil

          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          def minify_css(css):
              css = re.sub(r'/\*.*?\*/', '', css, flags=re.DOTALL)
              css = re.sub(r'\s*{\s*', '{', css)
              css = re.sub(r'\s*}\s*', '}', css)
              css = re.sub(r'\s*:\s*', ':', css)
              css = re.sub(r'\s*;\s*', ';', css)
              css = re.sub(r'\s*,\s*', ',', css)
              css = re.sub(r'\n+', '', css)
              css = re.sub(r'  +', ' ', css)
              return css.strip()

          def minify_js(js):
              js = re.sub(r'//[^\n]*', '', js)
              js = re.sub(r'\n\s*\n', '\n', js)
              js = re.sub(r'  +', ' ', js)
              return js.strip()

          html = re.sub(
              r'(<style[^>]*>)(.*?)(</style>)',
              lambda m: m.group(1) + minify_css(m.group(2)) + m.group(3),
              html,
              flags=re.DOTALL
          )
          html = re.sub(
              r'(<script(?![^>]*src)[^>]*>)(.*?)(</script>)',
              lambda m: m.group(1) + minify_js(m.group(2)) + m.group(3),
              html,
              flags=re.DOTALL
          )
          minified = htmlmin.minify(
              html,
              remove_comments=True,
              remove_empty_space=True,
              reduce_boolean_attributes=False,
              remove_optional_attribute_quotes=False,
              keep_pre=True
          )

          os.makedirs('dist', exist_ok=True)
          with open('dist/index.html', 'w', encoding='utf-8') as f:
              f.write(minified)
          PYEOF

          # Publish all static site content. The previous workflow only copied
          # the root index.html and assets, which excluded nested pages such as
          # /training/, /consulting/ and /engineering/*.
          cp -r assets dist/assets
          for path in training consulting engineering; do
            if [ -d "$path" ]; then cp -r "$path" "dist/$path"; fi
          done
          for file in robots.txt sitemap.xml llms.txt index-old.html CNAME; do
            if [ -f "$file" ]; then cp "$file" "dist/$file"; fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
