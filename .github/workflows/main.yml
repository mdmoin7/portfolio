name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check --no-cache-dir htmlmin rcssmin rjsmin

      - name: Build and minify static site
        run: python scripts/build.py

      - name: Include standalone contact card
        run: |
          rm -rf dist/contact
          cp -R contact dist/contact

      - name: Ensure contact entry point is deployed
        run: |
          cp contact-entry.js dist/contact-entry.js
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("dist/index.html")
          html = path.read_text(encoding="utf-8")

          # The source homepage may already contain the script. If it does not,
          # inject it before </body>. Do not depend on the exact main.js tag,
          # because HTML minification can change attribute formatting.
          if not re.search(r'<script[^>]+src=["\'](?:\./)?contact-entry\.js["\'][^>]*></script>', html, re.IGNORECASE):
              tag = '<script src="./contact-entry.js" defer></script>'
              html, count = re.subn(r'</body>', tag + '\n</body>', html, count=1, flags=re.IGNORECASE)
              if count != 1:
                  raise SystemExit("Could not locate </body> in dist/index.html")
              path.write_text(html, encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "dist"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
