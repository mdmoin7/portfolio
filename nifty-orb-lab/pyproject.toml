[project]
name = "nifty-orb-lab"
version = "0.1.0"
description = "Research backtester for a Nifty directional 1.5R ORB options system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nifty-orb = "nifty_orb.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nifty_orb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
